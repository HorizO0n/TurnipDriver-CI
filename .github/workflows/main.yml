
name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: ["aarch64"]
      fail-fast: false

    name: "Build for Arm64"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt update
          sudo apt install -y \
            libxrandr-dev libxxf86vm-dev libxcb-*-dev \
            libx11-xcb-dev libxfixes-dev libdrm-dev \
            libx11-dev glslang-tools ccache gettext-base \
            curl unzip git python3-pip binutils

          python3 -m pip install --user \
            --break-system-packages mako meson ninja

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup environment variables
        run: |
          echo "NDK_VER=android-ndk-r29" >> "$GITHUB_ENV"
          echo "SDK_VER=34" >> "$GITHUB_ENV"
          echo "WORK_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/.ccache"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}

      - name: Download NDK and Mesa
        run: |
          set -euo pipefail

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_VER}-linux.zip" \
            -o "${NDK_VER}-linux.zip"

          unzip -q "${NDK_VER}-linux.zip"

          git clone --depth 1 --branch main \
            https://gitlab.freedesktop.org/mesa/mesa

      - name: Build Turnip (Freedreno Vulkan)
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE="android-${{ matrix.arch }}"
          NDK_BIN="${WORK_DIR}/${NDK_VER}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "ERRO: arquivo $SOURCE_FILE não encontrado"
            exit 1
          fi

          echo "===== GERANDO CROSSFILE ====="

          python3 - "$SOURCE_FILE" <<'PY' > /tmp/crossfile-template
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()

          # Remove b_lto de host_machine, se existir.
          text = re.sub(
              r"(?m)^[ \t]*b_lto[ \t]*=.*(?:\n|$)",
              "",
              text
          )

          # Evita a chave inválida 'pkg-config' com aspas.
          text = re.sub(
              r"(?m)^([ \t]*)['\"]pkg-config['\"]([ \t]*=)",
              r"\1pkgconfig\2",
              text
          )

          # Corrige o nome antigo caso esteja presente.
          text = re.sub(
              r"(?m)^([ \t]*)pkgconfig([ \t]*=)",
              r"\1pkgconfig\2",
              text
          )

          sys.stdout.write(text)
          PY

          envsubst < /tmp/crossfile-template > build-crossfile

          echo "===== CROSSFILE GERADO ====="
          cat build-crossfile

          echo "===== VALIDANDO CROSSFILE ====="

          python3 - <<'PY'
          import ast
          import configparser
          from pathlib import Path

          path = Path("build-crossfile")
          config = configparser.ConfigParser(
              interpolation=None,
              inline_comment_prefixes=("#", ";")
          )

          if not config.read(path):
              raise SystemExit("ERRO: crossfile não encontrado")

          for section in ("binaries", "host_machine"):
              if not config.has_section(section):
                  raise SystemExit(f"ERRO: seção [{section}] ausente")

          for key in ("system", "cpu_family", "cpu", "endian"):
              if not config.has_option("host_machine", key):
                  raise SystemExit(f"ERRO: campo ausente: {key}")

              value = config.get("host_machine", key).strip()

              try:
                  parsed = ast.literal_eval(value)
              except (ValueError, SyntaxError):
                  raise SystemExit(f"ERRO: valor inválido em {key}: {value}")

              if not isinstance(parsed, str):
                  raise SystemExit(f"ERRO: {key} precisa ser string")

              print(f"{key} = {parsed!r}")

          if config.has_option("host_machine", "b_lto"):
              raise SystemExit("ERRO: b_lto ainda está em host_machine")

          if not config.has_option("binaries", "pkgconfig"):
              raise SystemExit("ERRO: entrada pkgconfig ausente")

          print("Crossfile validado com sucesso.")
          PY

          # Adiciona opções do linker ao crossfile.
          # A política ignore-all permite referências que o build Android
          # espera resolver no ambiente de execução; libandroid é ligada
          # explicitamente para as APIs AHardwareBuffer.
          cat >> build-crossfile <<'EOF'

          [built-in options]
          cpp_link_args = ['-Wl,--unresolved-symbols=ignore-all', '-Wl,--no-as-needed', '-landroid']
          EOF

          echo "===== CONFIGURANDO MESA ====="
          meson --version

          cd mesa

          meson setup build-android \
            --cross-file ../build-crossfile \
            --prefix=/tmp/mesa \
            -Dbuildtype=release \
            -Doptimization=s \
            -Dstrip=true \
            -Db_lto=false \
            -Db_asneeded=false \
            -Dplatforms=android \
            -Dplatform-sdk-version="${SDK_VER}" \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dandroid-libbacktrace=disabled \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dgles1=false \
            -Dgles2=false \
            -Degl=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dc_args="-DTU_MAX_CHIP_GEN=6 -fvisibility=hidden -fno-rtti -fno-exceptions" \
            -Dcpp_args="-DTU_MAX_CHIP_GEN=6 -fvisibility=hidden -fno-rtti -fno-exceptions"

          echo "===== COMPILANDO TURNIP ====="

          ninja -C build-android \
            src/freedreno/vulkan/libvulkan_freedreno.so

          echo "===== PREPARANDO ARTEFATO ====="

          OUTPUT="/tmp/mesa/turnip/libvulkan_freedreno.so"
          mkdir -p /tmp/mesa/turnip

          cp \
            build-android/src/freedreno/vulkan/libvulkan_freedreno.so \
            "$OUTPUT"

          test -s "$OUTPUT"

          "${NDK_BIN}/llvm-strip" --strip-unneeded "$OUTPUT"

          echo "===== VERIFICANDO BIBLIOTECA ====="
          file "$OUTPUT"
          "${NDK_BIN}/llvm-readelf" -d "$OUTPUT" || true

          echo "===== TURNIP COMPILADO ====="

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload Turnip
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Android-Arm64
          path: /tmp/mesa/turnip/libvulkan_freedreno.so
          if-no-files-found: error
