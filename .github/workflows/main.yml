
name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: ["aarch64"]
      fail-fast: false

    name: "Build for Arm64"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libxrandr-dev libxxf86vm-dev libxcb-*-dev \
            libx11-xcb-dev libxfixes-dev libdrm-dev \
            libx11-dev glslang-tools ccache gettext-base \
            curl unzip git python3-pip

          python3 -m pip install --user \
            --break-system-packages mako meson ninja

      - name: Setup environment variables
        run: |
          echo "NDK_VER=android-ndk-r29" >> "$GITHUB_ENV"
          echo "SDK_VER=34" >> "$GITHUB_ENV"
          echo "WORK_DIR=$PWD" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ccache"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}

      - name: Download NDK and Mesa
        run: |
          set -euo pipefail

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_VER}-linux.zip" \
            -o "${NDK_VER}-linux.zip"

          unzip -q "${NDK_VER}-linux.zip"

          git clone --depth 1 --branch main \
            https://gitlab.freedesktop.org/mesa/mesa

      - name: Build Turnip (Freedreno Vulkan)
        shell: bash
        run: |
          set -euo pipefail

          envsubst < "android-${{ matrix.arch }}" > build-crossfile

          echo "===== CROSSFILE GERADO ====="
          cat build-crossfile

          echo "===== VALIDAR CROSSFILE ====="
          python3 - <<'PY'
          import ast
          import configparser

          config = configparser.ConfigParser(
              interpolation=None,
              inline_comment_prefixes=("#", ";")
          )

          if not config.read("build-crossfile"):
              raise SystemExit("ERRO: crossfile não encontrado")

          if not config.has_section("host_machine"):
              raise SystemExit("ERRO: seção [host_machine] ausente")

          required = ["system", "cpu_family", "cpu", "endian"]

          for key in required:
              if not config.has_option("host_machine", key):
                  raise SystemExit(f"ERRO: campo ausente: {key}")

              value = config.get("host_machine", key).strip()

              try:
                  parsed = ast.literal_eval(value)
              except (ValueError, SyntaxError):
                  raise SystemExit(
                      f"ERRO: valor inválido em host_machine.{key}: {value}"
                  )

              if not isinstance(parsed, str):
                  raise SystemExit(
                      f"ERRO: host_machine.{key} precisa ser string"
                  )

              print(f"{key} = {parsed!r}")

          if config.has_option("host_machine", "b_lto"):
              raise SystemExit(
                  "ERRO: remova b_lto de [host_machine]; "
                  "use -Db_lto=false no Meson"
              )

          if config.has_option("binaries", "pkgconfig"):
              raise SystemExit(
                  "ERRO: troque pkgconfig por 'pkg-config' "
                  "no arquivo android-aarch64"
              )
          PY

          cd mesa

          meson --version

          meson setup build-android \
            --cross-file ../build-crossfile \
            --prefix=/tmp/mesa \
            -Dbuildtype=release \
            -Doptimization=s \
            -Dstrip=true \
            -Db_lto=false \
            -Db_asneeded=false \
            -Dplatforms=android \
            -Dplatform-sdk-version="${SDK_VER}" \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dgles1=false \
            -Dgles2=false \
            -Degl=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dc_args="-DTU_MAX_CHIP_GEN=6 -fvisibility=hidden -fno-rtti -fno-exceptions" \
            -Dcpp_args="-DTU_MAX_CHIP_GEN=6 -fvisibility=hidden -fno-rtti -fno-exceptions"

          ninja -C build-android \
            src/freedreno/vulkan/libvulkan_freedreno.so

          mkdir -p /tmp/mesa/turnip

          cp build-android/src/freedreno/vulkan/libvulkan_freedreno.so \
            /tmp/mesa/turnip/libvulkan_freedreno.so

          test -s /tmp/mesa/turnip/libvulkan_freedreno.so

          "${WORK_DIR}/${NDK_VER}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded \
            /tmp/mesa/turnip/libvulkan_freedreno.so

      - name: Show ccache stats
        run: ccache -s

      - name: Upload Turnip
        uses: actions/upload-artifact@v4
        with:
          name: Turnip
          path: /tmp/mesa/turnip/libvulkan_freedreno.so
