name: Android CI

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 2,9,16,23 * *"

jobs:
  build:
    strategy:
      matrix:
        arch: ["aarch64"]
      fail-fast: false

    name: "Build for Arm64"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libxrandr-dev libxxf86vm-dev libxcb-*-dev \
            libx11-xcb-dev libxfixes-dev libdrm-dev \
            libx11-dev glslang-tools ccache
          pip3 install mako meson ninja

      - name: Setup environment variables
        run: |
          echo "NDK_VER=android-ndk-r29" >> $GITHUB_ENV
          echo "SDK_VER=34" >> $GITHUB_ENV
          echo "WORK_DIR=$(pwd)" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=500M" >> $GITHUB_ENV
          mkdir -p ${{ github.workspace }}/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}

      - name: Download NDK and Mesa
        run: |
          curl -s https://dl.google.com/android/repository/${NDK_VER}-linux.zip -o ${NDK_VER}-linux.zip
          unzip -q ${NDK_VER}-linux.zip
          git clone --depth 1 --branch main https://gitlab.freedesktop.org/mesa/mesa

      - name: Build Turnip (Freedreno Vulkan)
        run: |
          envsubst < android-${{matrix.arch}} > build-crossfile
          cd mesa

          meson setup build-android \
            --cross-file ../build-crossfile \
            --prefix=/tmp/mesa \
            -Dbuildtype=release \
            -Dstrip=true \
            -Db_lto=false \
            -Dplatforms=android \
            -Dplatform-sdk-version=${SDK_VER} \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dgles1=false \
            -Dgles2=false \
            -Degl=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dc_link_args=-Wl,--gc-sections \
            -Dcpp_link_args=-Wl,--gc-sections

          ninja -C build-android install
          
          ${WORK_DIR}/${NDK_VER}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-unneeded \
            /tmp/mesa/lib/libvulkan_freedreno.so

          mkdir -p /tmp/mesa/turnip
          cp /tmp/mesa/lib/libvulkan_freedreno.so /tmp/mesa/turnip/libvulkan_freedreno.so

      - name: Show ccache stats
        run: ccache -s

      - name: Upload Turnip
        uses: actions/upload-artifact@v4
        with:
          name: Turnip
          path: /tmp/mesa/turnip/libvulkan_freedreno.so
